plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'force-minecraft'
}

version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	// Google's mirror of Maven Central first: Central answers busy CI runners with 429 Too Many Requests
	maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
	mavenCentral()
	// Mod Menu's API, for its "Configure" button (compile only: the mod runs without it)
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"force_mc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// client game tests (Fabric API): the real client, headless in CI and in scripts/gametest.sh, makes a world, opens the
// console against a demo Force, types into it, and keeps screenshots of each step
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "force_mc_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// the protocol and model code is plain Java: tested without Minecraft
	testImplementation platform('org.junit:junit-bom:5.13.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	def mc = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft_version", mc
	filesMatching("fabric.mod.json") {
		expand "version": version, "minecraft_version": mc
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
