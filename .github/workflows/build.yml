# Every push and pull request: the mod and its unit tests, and the real client (headless, in Docker) against a Force
# built from Force's main, for each Minecraft version the mod ships for.
name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.mc.minecraft }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc:
          - { minecraft: "26.2", fabric_api: "0.161.0+26.2" }
          - { minecraft: "26.3", fabric_api: "0.166.2+26.3" }
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pminecraft_version=${{ matrix.mc.minecraft }} -Pfabric_api_version=${{ matrix.mc.fabric_api }}
      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.mc.minecraft }}
          path: build/libs/

  gametest:
    name: gametest (${{ matrix.mc.minecraft }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc:
          - { minecraft: "26.2", fabric_api: "0.161.0+26.2" }
          - { minecraft: "26.3", fabric_api: "0.166.2+26.3" }
    steps:
      - uses: actions/checkout@v6
      - name: checkout Force
        uses: actions/checkout@v6
        with:
          repository: zalandemeter/force
          path: force-src
      - name: client game tests
        run: |
          chmod +x ./gradlew
          FORCE_REPO=force-src scripts/gametest.sh \
            -Pminecraft_version=${{ matrix.mc.minecraft }} -Pfabric_api_version=${{ matrix.mc.fabric_api }}
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-screenshots-${{ matrix.mc.minecraft }}
          path: build/run/clientGameTest/screenshots/
