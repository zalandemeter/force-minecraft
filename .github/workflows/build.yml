# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  # the real client, headless (Xvfb, Mesa), against a demo Force running `force api` from Force's main
  gametest:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: checkout Force
        uses: actions/checkout@v6
        with:
          repository: zalandemeter/force
          path: force-src
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: virtual display, tmux
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb tmux libgl1-mesa-dri
      - name: client game tests
        env:
          FORCE_REPO: ${{ github.workspace }}/force-src
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x ./gradlew
          python3 scripts/demo_force.py /tmp/force-demo > /tmp/demo.log 2>&1 &
          for i in $(seq 50); do grep -q FORCE_MC_COMMAND /tmp/demo.log && break; sleep 0.2; done
          export FORCE_MC_COMMAND="$(sed -n 's/^FORCE_MC_COMMAND=//p' /tmp/demo.log)"
          xvfb-run -a -s "-screen 0 2880x1800x24" ./gradlew runClientGameTest --no-daemon --console=plain
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-screenshots
          path: build/run/clientGameTest/screenshots/
